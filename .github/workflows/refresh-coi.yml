name: Obnova seznamu ČOI

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-coi
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/refresh-coi.mjs
      - name: Uložit změnu
        run: |
          git config user.name "overuju-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/coi-rizikove.json
          git diff --cached --quiet && exit 0
          git commit -m "Seznam ČOI: denní obnova"
          git push
